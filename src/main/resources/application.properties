spring.application.name=RecipeCatalogue

server.port=${SERVER_PORT:8083}

# --- Datasource --------------------------------------------------------------
# Each catalogue owns its own schema; no shared tables, no cross-service FKs.
# createDatabaseIfNotExist keeps local dev a one-liner against the compose MySQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/recipe_catalogue?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
# No password default on purpose (SECURITY.md H4). In a container it arrives as
# SPRING_DATASOURCE_PASSWORD (relaxed binding fills spring.datasource.password);
# from the IDE, Spring Boot's docker-compose support takes it from the running
# MySQL container, which got it from .env. If it is missing you get "Access
# denied ... (using password: NO)", not a silent fallback to a published value.

# --- Schema: Flyway owns it, Hibernate only validates -------------------------
# Migrations live in src/main/resources/db/migration (V1__init.sql, ...).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# RecipeResponse.from touches steps, ingredients (+ each ingredient's
# replacements) and tags on every row it maps. Without batching, a page of N
# recipes fires N+1 selects per lazy collection; with it Hibernate loads each
# collection for up to 64 parents at once (one "... where parent_id in (?, ?)").
# Paginated search stays a real SQL page (no in-memory paging, unlike a
# collection join-fetch), so this is the safe N+1 fix for the list endpoint.
spring.jpa.properties.hibernate.default_batch_fetch_size=64

# --- Spring Data REST ------------------------------------------------------------
# This service is a hand-written @RestController API, not auto-exposed
# repositories. Only surface repos explicitly annotated for Spring Data REST
# (none), and keep its base path off the API root just in case.
spring.data.rest.detection-strategy=annotated
spring.data.rest.base-path=/data

# --- Operations ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# CSV bulk import (POST /api/recipes/import)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Tracing -------------------------------------------------------------------
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# The checked-in API contract is served statically at /openapi.yaml
# (src/main/resources/static/openapi.yaml).

# --- Inter-service auth (SECURITY.md C1/C2) ------------------------------------
# Writes under /api/** must carry an HMAC X-Internal-Auth header from the BFF /
# UI / crawler. The User service additionally checks the acting user matches the
# {id} in the path.
internal-auth.enabled=${INTERNAL_AUTH_ENABLED:true}
# No default (SECURITY.md N1): startup fails unless INTERNAL_AUTH_SECRET is at
# least 32 random characters - from the environment in containers, locally from
# the git-ignored .env in the project directory.
internal-auth.secret=${INTERNAL_AUTH_SECRET:}
spring.config.import=optional:file:.env[.properties]
